<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Избранное — BizSupport</title>
<th:block th:replace="~{fragments/sidebar :: head}"/></head>
<body>
<th:block th:replace="~{fragments/sidebar :: sidebar(activePage='favorites')}"/>
<div class="main">
  <div class="page-header">
    <h1><i class="bi bi-star-fill" style="color:var(--warning)"></i> Избранное</h1>
    <p>Сохранённые налоговые режимы, сценарии госзакупок и тендеры</p>
  </div>
  <div th:if="${favorites.isEmpty()}" class="empty-state"><i class="bi bi-star"></i><p>Ничего не добавлено в избранное</p><p class="small">Нажмите ★ на странице налогового режима или сценария закупки</p></div>
  <div th:each="fav : ${favorites}" class="data-item">
    <div class="icon-circle" th:classappend="${fav['entityType'] == 'TAX_REGIME'} ? 'blue' : (${fav['entityType'] == 'PROCUREMENT'} ? 'cyan' : (${fav['entityType'] == 'TENDER'} ? 'amber' : 'danger'))">
      <i th:classappend="${fav['entityType'] == 'TAX_REGIME'} ? 'bi-calculator' : (${fav['entityType'] == 'PROCUREMENT'} ? 'bi-clipboard-check' : (${fav['entityType'] == 'TENDER'} ? 'bi-file-earmark-text' : 'bi-exclamation-triangle'))" class="bi"></i>
    </div>
    <div class="flex-grow-1">
      <a th:href="${fav['url']}" style="font-weight:600;text-decoration:none;color:var(--text)" th:text="${fav['title']}"></a>
      <div class="mt-1">
        <span class="badge-custom gray" th:text="${fav['entityTypeDisplay']}"></span>
        <span style="font-size:.8rem;color:var(--muted);margin-left:.5rem" th:text="${#temporals.format(fav['createdAt'], 'dd.MM.yyyy')}"></span>
      </div>
    </div>
    <form th:action="@{/favorites/{id}/remove(id=${fav['id']})}" method="post">
      <button type="submit" class="btn-star active" title="Убрать из избранного"><i class="bi bi-star-fill"></i></button>
    </form>
  </div>
</div>
<script th:replace="~{fragments/sidebar :: scripts}"></script>
</body></html>
