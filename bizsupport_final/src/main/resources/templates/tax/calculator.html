<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Калькулятор налогов — BizSupport</title>
<th:block th:replace="~{fragments/sidebar :: head}"/>
<style>
  .result-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:1.25rem 1.5rem;margin-bottom:1rem;position:relative;transition:border-color .2s}
  .result-card:hover{border-color:var(--accent)}
  .result-card.best{border-color:var(--success);border-width:2px}
  .result-card .badge-best{position:absolute;top:-10px;right:16px;background:var(--success);color:#fff;font-size:.75rem;font-weight:600;padding:3px 12px;border-radius:20px}
  .result-card .regime-name{font-weight:600;font-size:1.05rem}
  .result-card .total{font-size:1.5rem;font-weight:700}
  .result-card .rate{font-size:.85rem;color:var(--muted)}
  .result-card .details-row{display:flex;justify-content:space-between;padding:.3rem 0;font-size:.85rem;border-bottom:1px solid #F1F5F9}
  .result-card .details-row:last-child{border:none}
  .result-card .details-row .label{color:var(--muted)}
</style></head>
<body>
<th:block th:replace="~{fragments/sidebar :: sidebar(activePage='calculator')}"/>
<div class="main">
  <div class="page-header">
    <h1><i class="bi bi-graph-up" style="color:var(--accent)"></i> Калькулятор налогов</h1>
    <p>Сравните налоговую нагрузку по всем доступным режимам</p>
  </div>
  <div class="card-custom">
    <h5><i class="bi bi-sliders"></i> Параметры</h5>
    <form th:action="@{/tax/calculator}" method="get">
      <div class="row g-3">
        <div class="col-md-3"><label class="form-label">Годовой доход (₽)</label><input type="number" name="revenue" class="form-control" placeholder="3 000 000" th:value="${revenue}" required min="1"/></div>
        <div class="col-md-3"><label class="form-label">Годовые расходы (₽)</label><input type="number" name="expenses" class="form-control" placeholder="1 500 000" th:value="${expenses}"/></div>
        <div class="col-md-2"><label class="form-label">Сотрудники</label><input type="number" name="employees" class="form-control" placeholder="0" th:value="${employees}" min="0"/></div>
        <div class="col-md-2"><label class="form-label">Ср. зарплата (₽)</label><input type="number" name="avgSalary" class="form-control" placeholder="50 000" th:value="${avgSalary}"/></div>
        <div class="col-md-2"><label class="form-label">Форма</label><select name="ip" class="form-select"><option value="true" th:selected="${ip}">ИП</option><option value="false" th:selected="${!ip}">ООО</option></select></div>
      </div>
      <div class="mt-3"><button type="submit" class="btn-accent"><i class="bi bi-calculator"></i> Рассчитать</button></div>
    </form>
  </div>
  <div th:if="${results != null}">
    <div class="d-flex align-items-center justify-content-between mb-3">
      <h5 style="font-weight:600;margin:0"><i class="bi bi-bar-chart"></i> Результаты <span style="font-weight:400;font-size:.85rem;color:var(--muted)">(по возрастанию нагрузки)</span></h5>
      <button class="btn-outline-custom no-print" onclick="window.print()" style="font-size:.85rem"><i class="bi bi-file-pdf"></i> Скачать PDF</button>
    </div>
    <div class="row">
      <div th:each="r : ${results}" class="col-lg-6">
        <div class="result-card" th:classappend="${r.best} ? 'best'">
          <span th:if="${r.best}" class="badge-best"><i class="bi bi-check-circle"></i> Лучший</span>
          <div class="d-flex justify-content-between align-items-start mb-2"><span class="regime-name" th:text="${r.regimeName}"></span><span class="rate" th:text="'Эфф. ' + ${r.effectiveRate} + '%'"></span></div>
          <div class="total" th:text="${r.totalLoadFormatted}"></div>
          <div class="progress-custom"><div class="fill" th:classappend="${r.best} ? 'green'" th:style="'width:' + ${r.effectiveRate} + '%'"></div></div>
          <div class="mt-3"><div th:each="entry : ${r.details}" class="details-row"><span class="label" th:text="${entry.key}"></span><span th:text="${entry.value}"></span></div></div>
        </div>
      </div>
    </div>
  </div>
  <div th:if="${results == null}" class="empty-state"><i class="bi bi-calculator"></i><p>Введите параметры и нажмите «Рассчитать»</p><p class="small">Калькулятор сравнит УСН 6%, УСН 15%, ОСНО, ПСН и НПД</p></div>
</div>
<script th:replace="~{fragments/sidebar :: scripts}"></script>
</body></html>
