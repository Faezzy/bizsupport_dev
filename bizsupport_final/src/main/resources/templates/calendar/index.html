<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/>
<title>Календарь дедлайнов — BizSupport</title>
<th:block th:replace="~{fragments/sidebar :: head}"/>
<style>
    .cal-layout { display: grid; grid-template-columns: 1fr 360px; gap: 24px; }
    .cal-card { background: white; border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
    .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .cal-head h3 { margin: 0; font-size: 16px; font-weight: 600; text-transform: capitalize; }
    .cal-nav button { background: #F1F5F9; border: 1px solid var(--border); border-radius: 6px; width: 32px; height: 32px; cursor: pointer; font-size: 16px; color: var(--text); }
    .cal-nav button:hover { background: #E2E8F0; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .cal-dow { text-align: center; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; padding: 4px 0; }
    .cal-cell { aspect-ratio: 1 / 1; border: 1px solid var(--border); border-radius: 8px; padding: 5px; font-size: 13px; cursor: default; position: relative; display: flex; flex-direction: column; }
    .cal-cell.empty { border: none; }
    .cal-cell.today { border-color: var(--accent); border-width: 2px; }
    .cal-cell.has-events { cursor: pointer; background: #F8FAFC; }
    .cal-cell.has-events:hover { background: #EFF6FF; }
    .cal-cell.selected { background: #DBEAFE; border-color: var(--accent); }
    .cal-daynum { font-weight: 500; }
    .cal-dots { display: flex; gap: 3px; flex-wrap: wrap; margin-top: auto; }
    .cal-dot { width: 7px; height: 7px; border-radius: 50%; }
    .cal-dot.TAX { background: #3B82F6; }
    .cal-dot.TENDER { background: #F59E0B; }
    .agenda-item { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid #F1F5F9; }
    .agenda-item:last-child { border-bottom: none; }
    .agenda-date { flex-shrink: 0; width: 46px; text-align: center; }
    .agenda-date .d { font-size: 20px; font-weight: 700; line-height: 1; }
    .agenda-date .m { font-size: 11px; color: var(--muted); text-transform: uppercase; }
    .agenda-body { flex: 1; min-width: 0; }
    .agenda-title { font-weight: 600; font-size: 14px; }
    .agenda-title a { color: var(--text); text-decoration: none; }
    .agenda-title a:hover { color: var(--accent); }
    .agenda-desc { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .agenda-badge { display: inline-block; font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 5px; margin-top: 4px; }
    .agenda-badge.TAX { background: #EFF6FF; color: #1D4ED8; }
    .agenda-badge.TENDER { background: #FEF3C7; color: #92400E; }
    .agenda-soon { font-size: 11px; color: var(--warning); font-weight: 500; }
    .agenda-urgent { color: var(--danger); }
    .cal-legend { display: flex; gap: 16px; font-size: 12px; color: var(--muted); margin-top: 12px; }
    .cal-legend span { display: inline-flex; align-items: center; gap: 6px; }
    .empty-state { text-align: center; padding: 40px 20px; color: var(--muted); }
    @media (max-width: 900px) { .cal-layout { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<th:block th:replace="~{fragments/sidebar :: sidebar(activePage='calendar')}"/>
<div class="main">
  <div class="page-header">
    <h1><i class="bi bi-calendar-event" style="color:var(--accent)"></i> Календарь дедлайнов</h1>
    <p>Налоговые сроки и дедлайны подачи заявок по тендерам из избранного</p>
  </div>

  <div class="cal-layout">
    <div class="cal-card">
      <div class="cal-head">
        <h3 id="calTitle">—</h3>
        <div class="cal-nav" style="display:flex;gap:6px">
          <button onclick="changeMonth(-1)" title="Предыдущий месяц">‹</button>
          <button onclick="goToday()" title="Сегодня" style="width:auto;padding:0 10px;font-size:13px">Сегодня</button>
          <button onclick="changeMonth(1)" title="Следующий месяц">›</button>
        </div>
      </div>
      <div class="cal-grid" id="calDow"></div>
      <div class="cal-grid" id="calGrid" style="margin-top:4px"></div>
      <div class="cal-legend">
        <span><span class="cal-dot TAX"></span> Налоги</span>
        <span><span class="cal-dot TENDER"></span> Тендеры</span>
      </div>
    </div>

    <div class="cal-card">
      <h3 style="margin:0 0 12px;font-size:15px;font-weight:600" id="agendaTitle">Ближайшие события</h3>
      <div id="agenda"></div>
    </div>
  </div>
</div>

<script th:inline="javascript">
    const EVENTS = /*[[${events}]]*/ [];
    const MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
    const MONTHS_SHORT = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
    const DOW = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];

    let viewYear, viewMonth;          // отображаемый месяц
    let selectedDate = null;          // выбранная дата (yyyy-MM-dd) для фильтра agenda

    const todayStr = (() => {
        const t = new Date();
        return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;
    })();

    function eventsOn(dateStr) { return EVENTS.filter(e => e.date === dateStr); }

    function renderDow() {
        document.getElementById('calDow').innerHTML =
            DOW.map(d => `<div class="cal-dow">${d}</div>`).join('');
    }

    function renderGrid() {
        document.getElementById('calTitle').textContent = MONTHS[viewMonth] + ' ' + viewYear;
        const first = new Date(viewYear, viewMonth, 1);
        let startDow = (first.getDay() + 6) % 7; // Пн=0
        const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
        let html = '';
        for (let i = 0; i < startDow; i++) html += '<div class="cal-cell empty"></div>';
        for (let day = 1; day <= daysInMonth; day++) {
            const ds = `${viewYear}-${String(viewMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
            const evs = eventsOn(ds);
            const cls = ['cal-cell'];
            if (ds === todayStr) cls.push('today');
            if (evs.length) cls.push('has-events');
            if (ds === selectedDate) cls.push('selected');
            const types = [...new Set(evs.map(e => e.type))];
            const dots = types.map(t => `<span class="cal-dot ${t}"></span>`).join('');
            html += `<div class="${cls.join(' ')}" ${evs.length ? `onclick="selectDate('${ds}')"` : ''}>
                        <span class="cal-daynum">${day}</span>
                        <span class="cal-dots">${dots}</span>
                     </div>`;
        }
        document.getElementById('calGrid').innerHTML = html;
    }

    function daysUntil(dateStr) {
        const d = new Date(dateStr + 'T00:00:00');
        const t = new Date(todayStr + 'T00:00:00');
        return Math.round((d - t) / 86400000);
    }

    function renderAgenda() {
        const agenda = document.getElementById('agenda');
        const title = document.getElementById('agendaTitle');
        let list;
        if (selectedDate) {
            list = eventsOn(selectedDate);
            title.innerHTML = 'События на ' + selectedDate.split('-').reverse().join('.') +
                ' <button onclick="clearSelection()" style="float:right;background:none;border:none;color:var(--accent);cursor:pointer;font-size:12px">показать все</button>';
        } else {
            list = [...EVENTS].sort((a,b) => a.date.localeCompare(b.date));
            title.textContent = 'Ближайшие события';
        }
        if (!list.length) {
            agenda.innerHTML = '<div class="empty-state"><i class="bi bi-calendar-x" style="font-size:32px"></i><p>Нет дедлайнов на ближайшие 6 месяцев</p><p class="small" style="font-size:12px">Добавьте тендеры в избранное и выберите налоговый режим</p></div>';
            return;
        }
        agenda.innerHTML = list.map(e => {
            const [y,mo,d] = e.date.split('-');
            const du = daysUntil(e.date);
            let soon = '';
            if (du >= 0 && du <= 1) soon = '<div class="agenda-soon agenda-urgent">⚠ ' + (du === 0 ? 'сегодня' : 'завтра') + '</div>';
            else if (du > 1 && du <= 5) soon = '<div class="agenda-soon">через ' + du + ' дн.</div>';
            return `<div class="agenda-item">
                <div class="agenda-date"><div class="d">${parseInt(d)}</div><div class="m">${MONTHS_SHORT[parseInt(mo)-1]}</div></div>
                <div class="agenda-body">
                    <div class="agenda-title"><a href="${e.url}">${escapeHtml(e.title)}</a></div>
                    ${e.description ? '<div class="agenda-desc">' + escapeHtml(e.description) + '</div>' : ''}
                    <span class="agenda-badge ${e.type}">${e.type === 'TAX' ? 'Налоги' : 'Тендер'}</span>
                    ${soon}
                </div>
            </div>`;
        }).join('');
    }

    function escapeHtml(s) {
        const div = document.createElement('div');
        div.textContent = s == null ? '' : s;
        return div.innerHTML;
    }

    function selectDate(ds) { selectedDate = (selectedDate === ds) ? null : ds; renderGrid(); renderAgenda(); }
    function clearSelection() { selectedDate = null; renderGrid(); renderAgenda(); }
    function changeMonth(delta) {
        viewMonth += delta;
        if (viewMonth < 0) { viewMonth = 11; viewYear--; }
        if (viewMonth > 11) { viewMonth = 0; viewYear++; }
        renderGrid();
    }
    function goToday() {
        const t = new Date();
        viewYear = t.getFullYear(); viewMonth = t.getMonth();
        selectedDate = null; renderGrid(); renderAgenda();
    }

    (function init() {
        const t = new Date();
        viewYear = t.getFullYear(); viewMonth = t.getMonth();
        renderDow(); renderGrid(); renderAgenda();
    })();
</script>
<script th:replace="~{fragments/sidebar :: scripts}"></script>
</body></html>
