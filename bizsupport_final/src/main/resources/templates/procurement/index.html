<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Госзакупки — BizSupport</title>
<th:block th:replace="~{fragments/sidebar :: head}"/></head>
<body>
<th:block th:replace="~{fragments/sidebar :: sidebar(activePage='procurement')}"/>
<div class="main">
  <div class="page-header">
    <h1><i class="bi bi-clipboard-check" style="color:var(--info)"></i> Госзакупки</h1>
    <p>Сценарии участия в закупках по 44-ФЗ и 223-ФЗ</p>
  </div>
  <div th:if="${isMsp}" class="alert-custom info mb-4"><i class="bi bi-shield-check" style="color:var(--info)"></i> Ваша компания — субъект МСП. Показаны приоритетные сценарии.</div>
  <div class="row g-3 mb-4">
    <div class="col-md-6"><a th:href="@{/procurement/checklists}" class="action-card"><div class="icon-circle amber"><i class="bi bi-list-check"></i></div><div><div class="action-title">Мои чек-листы</div><div class="action-desc">Активные чек-листы участия в закупках</div></div></a></div>
  </div>
  <h5 style="font-weight:600;margin-bottom:1rem">Сценарии</h5>
  <div th:each="s : ${scenarios}" class="data-item">
    <div class="icon-circle" th:classappend="${s.lawType.name() == 'FZ_44'} ? 'blue' : 'cyan'"><i class="bi bi-file-earmark-ruled"></i></div>
    <div class="flex-grow-1">
      <a th:href="@{/procurement/scenario/{id}(id=${s.id})}" style="font-weight:600;text-decoration:none;color:var(--text)" th:text="${s.title}"></a>
      <div style="font-size:.85rem;color:var(--muted)" th:text="${s.description != null} ? ${#strings.abbreviate(s.description, 120)} : ''"></div>
      <div class="mt-1">
        <span class="badge-custom" th:classappend="${s.lawType.name() == 'FZ_44'} ? 'blue' : 'cyan'" th:text="${s.lawType.displayName}"></span>
        <span th:if="${s.mspOnly}" class="badge-custom green">МСП</span>
      </div>
    </div>
    <a th:href="@{/procurement/scenario/{id}(id=${s.id})}" class="btn-outline-custom">Подробнее →</a>
  </div>
</div>
<script th:replace="~{fragments/sidebar :: scripts}"></script>
</body></html>
