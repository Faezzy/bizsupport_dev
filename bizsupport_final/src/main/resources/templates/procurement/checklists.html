<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Мои чек-листы — BizSupport</title>
<th:block th:replace="~{fragments/sidebar :: head}"/></head>
<body>
<th:block th:replace="~{fragments/sidebar :: sidebar(activePage='procurement')}"/>
<div class="main">
  <div class="page-header">
    <h1><i class="bi bi-list-check" style="color:var(--warning)"></i> Мои чек-листы</h1>
    <p>Активные чек-листы участия в закупках</p>
  </div>

  <!-- Templates to copy -->
  <div th:if="${templates != null and !#lists.isEmpty(templates)}" class="card-custom mb-4">
    <h5><i class="bi bi-plus-circle" style="color:var(--accent)"></i> Создать новый</h5>
    <div class="d-flex flex-wrap gap-2">
      <form th:each="t : ${templates}" th:action="@{'/procurement/checklist/copy/' + ${t.id}}" method="post">
        <button type="submit" class="btn-accent"><i class="bi bi-copy"></i> <span th:text="${t.title}"></span></button>
      </form>
    </div>
  </div>

  <div th:if="${#lists.isEmpty(checklists)}" class="empty-state"><i class="bi bi-clipboard"></i><p>У вас пока нет чек-листов</p><p class="small">Создайте чек-лист из шаблона выше</p></div>

  <div th:each="cl : ${checklists}" class="data-item">
    <div class="icon-circle" th:classappend="${cl.isCompleted} ? 'green' : 'amber'">
      <i th:classappend="${cl.isCompleted} ? 'bi-check-circle-fill' : 'bi-hourglass-split'" class="bi"></i>
    </div>
    <div class="flex-grow-1">
      <a th:href="@{/procurement/checklist/{id}(id=${cl.id})}" style="font-weight:600;text-decoration:none;color:var(--text)" th:text="${cl.title}"></a>
      <div class="progress-custom" style="max-width:200px"><div class="fill" th:classappend="${cl.progressPercent == 100} ? 'green'" th:style="'width:' + ${cl.progressPercent} + '%'"></div></div>
      <div style="font-size:.8rem;color:var(--muted)" th:text="${cl.completedStepsCount} + ' / ' + ${#lists.size(cl.steps)} + ' шагов'"></div>
    </div>
    <span class="badge-custom" th:classappend="${cl.isCompleted} ? 'green' : 'amber'" th:text="${cl.isCompleted} ? 'Завершён' : (${cl.progressPercent} + '%')"></span>
  </div>
</div>
<script th:replace="~{fragments/sidebar :: scripts}"></script>
</body></html>
