<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Сценарий — BizSupport</title>
<th:block th:replace="~{fragments/sidebar :: head}"/></head>
<body>
<th:block th:replace="~{fragments/sidebar :: sidebar(activePage='procurement')}"/>
<div class="main">
  <div th:if="${scenario != null}">
    <div class="page-header">
      <div class="d-flex align-items-center gap-3">
        <h1 th:text="${scenario.title}">Сценарий</h1>
        <form th:action="@{/procurement/scenario/{id}/favorite(id=${scenario.id})}" method="post">
          <button type="submit" class="btn-star" th:classappend="${isFavorite} ? 'active'"><i th:classappend="${isFavorite} ? 'bi-star-fill' : 'bi-star'" class="bi"></i></button>
        </form>
      </div>
      <p th:text="${scenario.description}"></p>
      <div class="d-flex gap-2 mt-2">
        <span class="badge-custom" th:classappend="${scenario.lawType.name() == 'FZ_44'} ? 'blue' : 'cyan'" th:text="${scenario.lawType.displayName}"></span>
        <span th:if="${scenario.mspOnly}" class="badge-custom green">Только для МСП</span>
      </div>
    </div>

    <!-- Checklists -->
    <div class="card-custom">
      <h5><i class="bi bi-list-check" style="color:var(--accent)"></i> Начать чек-лист</h5>
      <div th:if="${#lists.isEmpty(templates)}" style="color:var(--muted);font-size:.9rem">Шаблоны не найдены</div>
      <div th:each="t : ${templates}" class="mb-2">
        <form th:action="@{'/procurement/checklist/copy/' + ${t.id}}" method="post">
          <button type="submit" class="btn-accent"><i class="bi bi-copy"></i> <span th:text="${t.title}"></span></button>
        </form>
      </div>
    </div>

    <!-- Risks -->
    <div class="card-custom">
      <h5><i class="bi bi-exclamation-triangle" style="color:var(--danger)"></i> Типовые риски</h5>
      <div th:if="${#lists.isEmpty(risks)}" style="color:var(--muted);font-size:.9rem">Риски не указаны</div>
      <div class="accordion accordion-custom" id="risks">
        <div th:each="r, stat : ${risks}" class="accordion-item">
          <h2 class="accordion-header"><button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" th:attr="data-bs-target='#risk-' + ${stat.index}">
            <span class="badge-custom me-2" th:classappend="${r.riskType.name() == 'FINANCIAL'} ? 'danger' : (${r.riskType.name() == 'LEGAL'} ? 'amber' : 'gray')" th:text="${r.riskType.displayName}"></span>
            <span th:text="${r.title}"></span>
          </button></h2>
          <div th:id="'risk-' + ${stat.index}" class="accordion-collapse collapse">
            <div class="accordion-body">
              <p><strong>Описание:</strong> <span th:text="${r.description}"></span></p>
              <p style="color:var(--danger)"><strong>Последствие:</strong> <span th:text="${r.consequence}"></span></p>
              <p style="color:var(--success)"><strong>Рекомендация:</strong> <span th:text="${r.recommendation}"></span></p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Legal refs -->
    <div th:if="${legalRefs != null and !#lists.isEmpty(legalRefs)}" class="card-custom">
      <h5><i class="bi bi-journal-bookmark" style="color:var(--purple)"></i> Правовые ссылки</h5>
      <a th:each="ref : ${legalRefs}" th:href="${ref.url}" target="_blank" class="legal-link">
        <span><i class="bi bi-link-45deg" style="color:var(--accent)"></i> <span th:text="${ref.title}"></span></span>
        <span class="badge-custom gray" th:text="${ref.article}"></span>
      </a>
    </div>

    <a th:href="@{/procurement}" class="btn-outline-custom"><i class="bi bi-arrow-left"></i> Назад</a>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:replace="~{fragments/sidebar :: scripts}"></script>
</body></html>
