<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Пользователи — Админ</title>
<th:block th:replace="~{fragments/sidebar :: head}"/>
<style>.sidebar a.active{border-left-color:#A78BFA;background:rgba(167,139,250,.15)}</style>
</head>
<body>
<th:block th:replace="~{admin/sidebar :: sidebar(activePage='users')}"/>
<div class="main">
  <div class="page-header">
    <h1><i class="bi bi-people" style="color:#A78BFA"></i> Пользователи</h1>
    <p>Управление аккаунтами (<span th:text="${#lists.size(users)}"></span>)</p>
  </div>
  <div class="table-custom">
    <table class="table">
      <thead><tr><th>ID</th><th>Имя</th><th>Email</th><th>Роль</th><th>Регистрация</th><th>Действия</th></tr></thead>
      <tbody>
        <tr th:each="u : ${users}">
          <td th:text="${u.id}"></td>
          <td style="font-weight:500" th:text="${u.fullName}"></td>
          <td th:text="${u.email}"></td>
          <td>
            <span class="badge-custom" th:classappend="${u.role.name() == 'ADMIN'} ? 'purple' : 'gray'" th:text="${u.role}"></span>
          </td>
          <td style="font-size:.85rem;color:var(--muted)" th:text="${#temporals.format(u.createdAt, 'dd.MM.yyyy HH:mm')}"></td>
          <td>
            <div class="d-flex gap-1">
              <form th:action="@{/admin/users/{id}/toggle-role(id=${u.id})}" method="post">
                <button type="submit" class="btn-outline-custom" style="font-size:.8rem" th:text="${u.role.name() == 'ADMIN'} ? 'Снять админа' : 'Сделать админом'"></button>
              </form>
              <form th:action="@{/admin/users/{id}/delete(id=${u.id})}" method="post" onsubmit="return confirm('Удалить пользователя?')">
                <button type="submit" class="btn-outline-custom" style="font-size:.8rem;color:var(--danger)"><i class="bi bi-trash"></i></button>
              </form>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
</body></html>
