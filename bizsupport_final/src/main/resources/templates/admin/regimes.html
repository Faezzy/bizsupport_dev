<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Налог. режимы — Админ</title>
<th:block th:replace="~{fragments/sidebar :: head}"/>
<style>.sidebar a.active{border-left-color:#A78BFA;background:rgba(167,139,250,.15)}</style>
</head>
<body>
<th:block th:replace="~{admin/sidebar :: sidebar(activePage='regimes')}"/>
<div class="main">
  <div class="page-header">
    <h1><i class="bi bi-calculator" style="color:var(--success)"></i> Налоговые режимы</h1>
    <p>Справочник режимов налогообложения</p>
  </div>
  <div class="table-custom">
    <table class="table">
      <thead><tr><th>ID</th><th>Код</th><th>Название</th><th>НК РФ</th><th>Действия</th></tr></thead>
      <tbody>
        <tr th:each="r : ${regimes}">
          <td th:text="${r.id}"></td>
          <td><span class="badge-custom blue" th:text="${r.code}"></span></td>
          <td style="font-weight:500" th:text="${r.name}"></td>
          <td style="font-size:.85rem;color:var(--muted)" th:text="${r.nkRef}"></td>
          <td><a th:href="@{/admin/regimes/edit/{id}(id=${r.id})}" class="btn-outline-custom" style="font-size:.8rem"><i class="bi bi-pencil"></i> Изменить</a></td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
</body></html>
