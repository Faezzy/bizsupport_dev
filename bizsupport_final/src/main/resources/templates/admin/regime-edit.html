<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Редактирование режима — Админ</title>
<th:block th:replace="~{fragments/sidebar :: head}"/>
<style>.sidebar a.active{border-left-color:#A78BFA;background:rgba(167,139,250,.15)}</style>
</head>
<body>
<th:block th:replace="~{admin/sidebar :: sidebar(activePage='regimes')}"/>
<div class="main">
  <div class="page-header">
    <h1><i class="bi bi-pencil" style="color:var(--accent)"></i> Редактирование: <span th:text="${regime.name}"></span></h1>
  </div>
  <div class="card-custom" style="max-width:700px">
    <form th:action="@{/admin/regimes/save}" method="post">
      <input type="hidden" name="id" th:value="${regime.id}"/>
      <div class="row g-3">
        <div class="col-md-4"><label class="form-label">Код</label><input type="text" name="code" class="form-control" th:value="${regime.code}" required/></div>
        <div class="col-md-8"><label class="form-label">Название</label><input type="text" name="name" class="form-control" th:value="${regime.name}" required/></div>
        <div class="col-12"><label class="form-label">Описание</label><textarea name="description" class="form-control" rows="3" th:text="${regime.description}"></textarea></div>
        <div class="col-12"><label class="form-label">Условия (JSON)</label><textarea name="conditions" class="form-control" rows="2" style="font-family:var(--font-mono,monospace);font-size:.85rem" th:text="${regime.conditions}"></textarea></div>
        <div class="col-md-6"><label class="form-label">Ссылка на НК РФ</label><input type="text" name="nkRef" class="form-control" th:value="${regime.nkRef}"/></div>
      </div>
      <div class="mt-4 d-flex gap-2">
        <button type="submit" class="btn-accent"><i class="bi bi-check-lg"></i> Сохранить</button>
        <a th:href="@{/admin/regimes}" class="btn-outline-custom">Отмена</a>
      </div>
    </form>
  </div>

  <!-- Obligations list -->
  <div class="card-custom mt-4" style="max-width:700px" th:if="${obligations != null and !#lists.isEmpty(obligations)}">
    <h5><i class="bi bi-list-check" style="color:var(--accent)"></i> Обязательства (<span th:text="${#lists.size(obligations)}"></span>)</h5>
    <div th:each="ob : ${obligations}" class="data-item">
      <div class="flex-grow-1">
        <div style="font-weight:500" th:text="${ob.taxName}"></div>
        <div style="font-size:.85rem;color:var(--muted)" th:text="${ob.rate}"></div>
      </div>
    </div>
  </div>
</div>
</body></html>
