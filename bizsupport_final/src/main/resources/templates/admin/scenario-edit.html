<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Редактирование сценария — Админ</title>
<th:block th:replace="~{fragments/sidebar :: head}"/>
<style>.sidebar a.active{border-left-color:#A78BFA;background:rgba(167,139,250,.15)}</style>
</head>
<body>
<th:block th:replace="~{admin/sidebar :: sidebar(activePage='scenarios')}"/>
<div class="main">
  <div class="page-header">
    <h1><i class="bi bi-pencil" style="color:var(--accent)"></i> Редактирование: <span th:text="${scenario.title}"></span></h1>
  </div>
  <div class="card-custom" style="max-width:700px">
    <form th:action="@{/admin/scenarios/save}" method="post">
      <input type="hidden" name="id" th:value="${scenario.id}"/>
      <div class="row g-3">
        <div class="col-md-4"><label class="form-label">Тип закона</label><select name="lawType" class="form-select"><option value="FZ_44" th:selected="${scenario.lawType.name() == 'FZ_44'}">44-ФЗ</option><option value="FZ_223" th:selected="${scenario.lawType.name() == 'FZ_223'}">223-ФЗ</option></select></div>
        <div class="col-md-8"><label class="form-label">Название</label><input type="text" name="title" class="form-control" th:value="${scenario.title}" required/></div>
        <div class="col-12"><label class="form-label">Описание</label><textarea name="description" class="form-control" rows="3" th:text="${scenario.description}"></textarea></div>
        <div class="col-md-4"><div class="form-check mt-4"><input type="checkbox" name="mspOnly" value="true" class="form-check-input" th:checked="${scenario.mspOnly}"/><label class="form-check-label">Только для МСП</label></div></div>
      </div>
      <div class="mt-4 d-flex gap-2">
        <button type="submit" class="btn-accent"><i class="bi bi-check-lg"></i> Сохранить</button>
        <a th:href="@{/admin/scenarios}" class="btn-outline-custom">Отмена</a>
      </div>
    </form>
  </div>

  <div class="card-custom mt-4" style="max-width:700px" th:if="${risks != null and !#lists.isEmpty(risks)}">
    <h5><i class="bi bi-exclamation-triangle" style="color:var(--danger)"></i> Риски (<span th:text="${#lists.size(risks)}"></span>)</h5>
    <div th:each="r : ${risks}" class="data-item">
      <div class="flex-grow-1">
        <div style="font-weight:500" th:text="${r.title}"></div>
        <span class="badge-custom" th:classappend="${r.riskType.name() == 'FINANCIAL'} ? 'danger' : (${r.riskType.name() == 'LEGAL'} ? 'amber' : 'gray')" th:text="${r.riskType.displayName}"></span>
      </div>
    </div>
  </div>
</div>
</body></html>
