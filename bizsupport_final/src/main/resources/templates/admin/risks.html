<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Карточки рисков — Админ</title>
<th:block th:replace="~{fragments/sidebar :: head}"/>
<style>.sidebar a.active{border-left-color:#A78BFA;background:rgba(167,139,250,.15)}</style>
</head>
<body>
<th:block th:replace="~{admin/sidebar :: sidebar(activePage='risks')}"/>
<div class="main">
  <div class="page-header">
    <h1><i class="bi bi-exclamation-triangle" style="color:var(--danger)"></i> Карточки рисков</h1>
    <p>Управление рисками госзакупок (<span th:text="${#lists.size(risks)}"></span>)</p>
  </div>

  <!-- Add new risk -->
  <div class="card-custom">
    <h5><i class="bi bi-plus-circle" style="color:var(--accent)"></i> Добавить карточку риска</h5>
    <form th:action="@{/admin/risks/save}" method="post">
      <div class="row g-3">
        <div class="col-md-4"><label class="form-label">Сценарий</label>
          <select name="scenarioId" class="form-select" required>
            <option th:each="s : ${scenarios}" th:value="${s.id}" th:text="${s.lawType.displayName} + ' — ' + ${s.title}"></option>
          </select>
        </div>
        <div class="col-md-4"><label class="form-label">Тип риска</label>
          <select name="riskType" class="form-select" required>
            <option value="FINANCIAL">Финансовый</option>
            <option value="LEGAL">Юридический</option>
            <option value="PROCEDURAL">Процедурный</option>
          </select>
        </div>
        <div class="col-md-4"><label class="form-label">Название</label><input type="text" name="title" class="form-control" required/></div>
        <div class="col-md-4"><label class="form-label">Описание</label><textarea name="description" class="form-control" rows="2"></textarea></div>
        <div class="col-md-4"><label class="form-label">Последствие</label><textarea name="consequence" class="form-control" rows="2"></textarea></div>
        <div class="col-md-4"><label class="form-label">Рекомендация</label><textarea name="recommendation" class="form-control" rows="2"></textarea></div>
      </div>
      <div class="mt-3"><button type="submit" class="btn-accent"><i class="bi bi-plus-lg"></i> Добавить</button></div>
    </form>
  </div>

  <!-- List -->
  <div class="table-custom">
    <table class="table">
      <thead><tr><th>ID</th><th>Сценарий</th><th>Тип</th><th>Название</th><th></th></tr></thead>
      <tbody>
        <tr th:each="r : ${risks}">
          <td th:text="${r.id}"></td>
          <td>
            <span th:if="${r.scenario != null}" class="badge-custom" th:classappend="${r.scenario.lawType.name() == 'FZ_44'} ? 'blue' : 'cyan'" th:text="${r.scenario.lawType.displayName}"></span>
          </td>
          <td>
            <span class="badge-custom" th:classappend="${r.riskType.name() == 'FINANCIAL'} ? 'danger' : (${r.riskType.name() == 'LEGAL'} ? 'amber' : 'gray')" th:text="${r.riskType.displayName}"></span>
          </td>
          <td style="font-weight:500" th:text="${r.title}"></td>
          <td>
            <form th:action="@{/admin/risks/{id}/delete(id=${r.id})}" method="post" onsubmit="return confirm('Удалить?')">
              <button type="submit" class="btn-outline-custom" style="font-size:.8rem;color:var(--danger)"><i class="bi bi-trash"></i></button>
            </form>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
</body></html>
