<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Поиск — BizSupport</title>
<th:block th:replace="~{fragments/sidebar :: head}"/></head>
<body>
<th:block th:replace="~{fragments/sidebar :: sidebar(activePage='search')}"/>
<div class="main">
  <div class="page-header">
    <h1><i class="bi bi-search" style="color:var(--accent)"></i> Поиск</h1>
    <p>По налоговым режимам, сценариям госзакупок и тендерам</p>
  </div>
  <div class="card-custom">
    <form th:action="@{/search}" method="get">
      <div class="d-flex gap-2">
        <input type="text" name="q" class="form-control" placeholder="Введите запрос: УСН, 44-ФЗ, патент, название тендера..." th:value="${query}" autofocus/>
        <button type="submit" class="btn-accent"><i class="bi bi-search"></i></button>
      </div>
    </form>
  </div>
  <div th:if="${results != null and !#lists.isEmpty(results)}">
    <h5 style="font-weight:600;margin-bottom:1rem">Найдено: <span th:text="${#lists.size(results)}"></span></h5>
    <div th:each="r : ${results}" class="data-item">
      <div class="icon-circle" th:classappend="${r.type == 'TAX'} ? 'blue' : (${r.type == 'PROCUREMENT'} ? 'cyan' : 'amber')">
        <i th:classappend="${r.type == 'TAX'} ? 'bi-calculator' : (${r.type == 'PROCUREMENT'} ? 'bi-clipboard-check' : 'bi-file-earmark-text')" class="bi"></i>
      </div>
      <div class="flex-grow-1">
        <a th:href="${r.url}" style="font-weight:600;text-decoration:none;color:var(--text)" th:text="${r.title}"></a>
        <div style="font-size:.85rem;color:var(--muted)" th:text="${r.snippet}"></div>
      </div>
      <span class="badge-custom" th:classappend="${r.type == 'TAX'} ? 'blue' : (${r.type == 'PROCUREMENT'} ? 'cyan' : 'amber')"
            th:text="${r.type == 'TAX'} ? 'Налоги' : (${r.type == 'PROCUREMENT'} ? 'Закупки' : 'Тендер')"></span>
    </div>
  </div>
  <div th:if="${results != null and #lists.isEmpty(results)}" class="empty-state"><i class="bi bi-search"></i><p>Ничего не найдено по запросу «<span th:text="${query}"></span>»</p></div>
  <div th:if="${results == null}" class="empty-state"><i class="bi bi-search"></i><p>Начните вводить запрос</p></div>
</div>
<script th:replace="~{fragments/sidebar :: scripts}"></script>
</body></html>
