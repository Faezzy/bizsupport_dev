<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<aside th:fragment="sidebar(activePage)" class="sidebar" style="background:#1a1025">
  <div class="brand" style="border-bottom-color:#2d1f3d"><i class="bi bi-shield-lock-fill" style="color:#A78BFA"></i> Админ-панель</div>
  <nav>
    <a th:href="@{/admin}" th:classappend="${activePage == 'dashboard'} ? 'active'" style="--active-color:#A78BFA"><i class="bi bi-grid-1x2"></i> Обзор</a>
    <a th:href="@{/admin/users}" th:classappend="${activePage == 'users'} ? 'active'"><i class="bi bi-people"></i> Пользователи</a>
    <a th:href="@{/admin/regimes}" th:classappend="${activePage == 'regimes'} ? 'active'"><i class="bi bi-calculator"></i> Налог. режимы</a>
    <a th:href="@{/admin/scenarios}" th:classappend="${activePage == 'scenarios'} ? 'active'"><i class="bi bi-clipboard-check"></i> Сценарии закупок</a>
    <a th:href="@{/admin/risks}" th:classappend="${activePage == 'risks'} ? 'active'"><i class="bi bi-exclamation-triangle"></i> Карточки рисков</a>
    <div style="border-top:1px solid #2d1f3d;margin:1rem 0"></div>
    <a th:href="@{/dashboard}"><i class="bi bi-arrow-left"></i> Назад на сайт</a>
  </nav>
  <form th:action="@{/logout}" method="post"><button type="submit" class="logout-btn"><i class="bi bi-box-arrow-right"></i> Выйти</button></form>
</aside>
</html>
