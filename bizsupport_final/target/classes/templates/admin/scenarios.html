<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Сценарии — Админ</title>
<th:block th:replace="~{fragments/sidebar :: head}"/>
<style>.sidebar a.active{border-left-color:#A78BFA;background:rgba(167,139,250,.15)}</style>
</head>
<body>
<th:block th:replace="~{admin/sidebar :: sidebar(activePage='scenarios')}"/>
<div class="main">
  <div class="page-header">
    <h1><i class="bi bi-clipboard-check" style="color:var(--info)"></i> Сценарии госзакупок</h1>
    <p>Управление сценариями 44-ФЗ / 223-ФЗ</p>
  </div>
  <div class="table-custom">
    <table class="table">
      <thead><tr><th>ID</th><th>Закон</th><th>Название</th><th>МСП</th><th>Действия</th></tr></thead>
      <tbody>
        <tr th:each="s : ${scenarios}">
          <td th:text="${s.id}"></td>
          <td><span class="badge-custom" th:classappend="${s.lawType.name() == 'FZ_44'} ? 'blue' : 'cyan'" th:text="${s.lawType.displayName}"></span></td>
          <td style="font-weight:500" th:text="${s.title}"></td>
          <td><span th:if="${s.mspOnly}" class="badge-custom green">Да</span><span th:if="${!s.mspOnly}" class="badge-custom gray">Нет</span></td>
          <td><a th:href="@{/admin/scenarios/edit/{id}(id=${s.id})}" class="btn-outline-custom" style="font-size:.8rem"><i class="bi bi-pencil"></i> Изменить</a></td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
</body></html>
