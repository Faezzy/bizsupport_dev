<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!-- Sidebar fragment: usage th:replace="~{fragments/sidebar :: sidebar(activePage='dashboard')}" -->
<aside th:fragment="sidebar(activePage)" class="sidebar">
  <div class="brand"><i class="bi bi-briefcase-fill"></i> BizSupport</div>
  <nav>
    <a th:href="@{/dashboard}" th:classappend="${activePage == 'dashboard'} ? 'active'"><i class="bi bi-speedometer2"></i> Главная</a>
    <a th:href="@{/tax}" th:classappend="${activePage == 'tax'} ? 'active'"><i class="bi bi-calculator"></i> Налоги</a>
    <a th:href="@{/tax/calculator}" th:classappend="${activePage == 'calculator'} ? 'active'"><i class="bi bi-graph-up"></i> Калькулятор</a>
    <a th:href="@{/procurement}" th:classappend="${activePage == 'procurement'} ? 'active'"><i class="bi bi-clipboard-check"></i> Госзакупки</a>
    <a th:href="@{/search}" th:classappend="${activePage == 'search'} ? 'active'"><i class="bi bi-search"></i> Поиск</a>
    <a th:href="@{/profile}" th:classappend="${activePage == 'profile'} ? 'active'"><i class="bi bi-building"></i> Профиль</a>
    <a th:href="@{/favorites}" th:classappend="${activePage == 'favorites'} ? 'active'"><i class="bi bi-star"></i> Избранное</a>
    <a th:href="@{/notifications}" th:classappend="${activePage == 'notifications'} ? 'active'"><i class="bi bi-bell"></i> Уведомления<span id="notif-badge" class="badge bg-danger ms-auto" style="display:none;"></span></a>
    <div sec:authorize="hasRole('ADMIN')" style="border-top:1px solid #1E293B;margin:.5rem 0"></div>
    <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}" style="color:#A78BFA"><i class="bi bi-shield-lock"></i> Админ-панель</a>
  </nav>
  <form th:action="@{/logout}" method="post"><button type="submit" class="logout-btn"><i class="bi bi-box-arrow-right"></i> Выйти</button></form>
</aside>

<!-- Head links fragment -->
<th:block th:fragment="head">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
  <link th:href="@{/css/app.css}" rel="stylesheet"/>
</th:block>

<!-- Notification badge script -->
<script th:fragment="scripts">
  function updateBadge(){fetch('/notifications/count').then(r=>r.json()).then(d=>{const b=document.getElementById('notif-badge');if(d.count>0){b.textContent=d.count;b.style.display='';}else{b.style.display='none';}}).catch(()=>{});}updateBadge();setInterval(updateBadge,60000);
</script>
</html>
