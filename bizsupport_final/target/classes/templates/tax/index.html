<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Налоги — BizSupport</title>
<th:block th:replace="~{fragments/sidebar :: head}"/></head>
<body>
<th:block th:replace="~{fragments/sidebar :: sidebar(activePage='tax')}"/>
<div class="main">
  <div class="page-header">
    <h1><i class="bi bi-calculator" style="color:var(--accent)"></i> Налогообложение</h1>
    <p>Все налоговые режимы РФ для малого бизнеса</p>
  </div>

  <div th:if="${profile != null and currentRegimes != null and !#lists.isEmpty(currentRegimes)}" class="alert-custom info mb-4">
    <i class="bi bi-info-circle-fill" style="color:var(--info)"></i>
    <span>Ваш текущий режим: <strong th:each="cr : ${currentRegimes}" th:text="${cr.taxRegime.name}"></strong></span>
  </div>

  <div class="row g-3 mb-4">
    <div class="col-md-6"><a th:href="@{/tax/calculator}" class="action-card"><div class="icon-circle blue"><i class="bi bi-graph-up"></i></div><div><div class="action-title">Калькулятор налогов</div><div class="action-desc">Сравнить нагрузку по всем режимам</div></div></a></div>
    <div class="col-md-6"><a th:href="@{/tax/recommend}" class="action-card"><div class="icon-circle green"><i class="bi bi-check2-circle"></i></div><div><div class="action-title">Подобрать режим</div><div class="action-desc">По параметрам вашей компании</div></div></a></div>
  </div>

  <h5 style="font-weight:600;margin-bottom:1rem">Налоговые режимы</h5>
  <div th:each="r : ${allRegimes}" class="data-item">
    <div class="icon-circle blue"><i class="bi bi-file-earmark-text"></i></div>
    <div class="flex-grow-1">
      <a th:href="@{/tax/regime/{code}(code=${r.code})}" style="font-weight:600;text-decoration:none;color:var(--text)" th:text="${r.name}">Режим</a>
      <div style="font-size:.85rem;color:var(--muted)" th:text="${r.description != null} ? ${#strings.abbreviate(r.description, 100)} : ''"></div>
    </div>
    <span class="badge-custom gray" th:text="${r.nkRef}"></span>
  </div>
</div>
<script th:replace="~{fragments/sidebar :: scripts}"></script>
</body></html>
