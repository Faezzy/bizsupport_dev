<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Подбор режима — BizSupport</title>
<th:block th:replace="~{fragments/sidebar :: head}"/></head>
<body>
<th:block th:replace="~{fragments/sidebar :: sidebar(activePage='tax')}"/>
<div class="main">
  <div class="page-header">
    <h1><i class="bi bi-check2-circle" style="color:var(--success)"></i> Подбор налогового режима</h1>
    <p>Укажите параметры компании — мы покажем подходящие режимы</p>
  </div>
  <div class="card-custom">
    <h5><i class="bi bi-sliders"></i> Параметры</h5>
    <form th:action="@{/tax/recommend}" method="get">
      <div class="row g-3">
        <div class="col-md-4"><label class="form-label">Тип организации</label><select name="type" class="form-select" required><option value="">Выберите...</option><option th:each="ct : ${companyTypes}" th:value="${ct.name()}" th:text="${ct.displayName}" th:selected="${type == ct.name()}"></option></select></div>
        <div class="col-md-4"><label class="form-label">Кол-во сотрудников</label><input type="number" name="employees" class="form-control" th:value="${employees}" placeholder="0"/></div>
        <div class="col-md-4"><label class="form-label">Годовой доход (₽)</label><input type="number" name="revenue" class="form-control" th:value="${revenue}" placeholder="3 000 000"/></div>
      </div>
      <div class="mt-3"><button type="submit" class="btn-accent"><i class="bi bi-search"></i> Подобрать</button></div>
    </form>
  </div>
  <div th:if="${recommended != null}">
    <h5 style="font-weight:600;margin-bottom:1rem">Подходящие режимы (<span th:text="${#lists.size(recommended)}"></span>)</h5>
    <div th:each="r : ${recommended}" class="data-item">
      <div class="icon-circle green"><i class="bi bi-check-lg"></i></div>
      <div class="flex-grow-1">
        <a th:href="@{/tax/regime/{code}(code=${r.code})}" style="font-weight:600;text-decoration:none;color:var(--text)" th:text="${r.name}"></a>
        <div style="font-size:.85rem;color:var(--muted)" th:text="${r.description != null} ? ${#strings.abbreviate(r.description, 120)} : ''"></div>
      </div>
      <a th:href="@{/tax/regime/{code}(code=${r.code})}" class="btn-outline-custom">Подробнее →</a>
    </div>
    <div th:if="${#lists.isEmpty(recommended)}" class="empty-state"><i class="bi bi-x-circle"></i><p>Нет подходящих режимов для указанных параметров</p></div>
  </div>
</div>
<script th:replace="~{fragments/sidebar :: scripts}"></script>
</body></html>
