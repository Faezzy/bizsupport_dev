<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Чек-лист — BizSupport</title>
<th:block th:replace="~{fragments/sidebar :: head}"/></head>
<body>
<th:block th:replace="~{fragments/sidebar :: sidebar(activePage='procurement')}"/>
<div class="main">
  <div class="page-header">
    <h1 th:text="${checklist.title}">Чек-лист</h1>
    <p th:text="${checklist.description}"></p>
    <div class="d-flex align-items-center gap-3 mt-2">
      <div class="progress-custom" style="width:200px"><div class="fill" th:classappend="${checklist.progressPercent == 100} ? 'green'" th:style="'width:' + ${checklist.progressPercent} + '%'"></div></div>
      <span style="font-weight:600" th:text="${checklist.progressPercent} + '%'"></span>
      <span class="badge-custom" th:classappend="${checklist.isCompleted} ? 'green' : 'amber'" th:text="${checklist.isCompleted} ? 'Завершён' : 'В процессе'"></span>
    </div>
  </div>

  <div th:each="step : ${checklist.steps}" class="data-item">
    <form th:action="@{/procurement/checklist/step/{stepId}/toggle(stepId=${step.id})}" method="post" style="margin:0">
      <input type="hidden" name="checklistId" th:value="${checklist.id}"/>
      <button type="submit" style="background:none;border:none;cursor:pointer;padding:0">
        <div class="icon-circle" th:classappend="${step.isCompleted} ? 'green' : 'gray'" style="width:36px;height:36px">
          <i th:classappend="${step.isCompleted} ? 'bi-check-circle-fill' : 'bi-circle'" class="bi"></i>
        </div>
      </button>
    </form>
    <div class="flex-grow-1">
      <div style="font-weight:600" th:classappend="${step.isCompleted} ? 'text-decoration-line-through'" th:style="${step.isCompleted} ? 'opacity:.6' : ''">
        <span style="color:var(--muted);font-size:.85rem" th:text="${step.stepOrder} + '. '"></span>
        <span th:text="${step.title}"></span>
      </div>
      <div th:if="${step.description}" style="font-size:.85rem;color:var(--muted);margin-top:2px" th:text="${step.description}"></div>
      <div th:if="${step.hint}" style="font-size:.8rem;color:var(--info);margin-top:4px"><i class="bi bi-lightbulb"></i> <span th:text="${step.hint}"></span></div>
    </div>
    <span th:if="${step.completedAt != null}" style="font-size:.75rem;color:var(--muted)" th:text="${#temporals.format(step.completedAt, 'dd.MM HH:mm')}"></span>
  </div>

  <div class="mt-3"><a th:href="@{/procurement/checklists}" class="btn-outline-custom"><i class="bi bi-arrow-left"></i> К чек-листам</a></div>
</div>
<script th:replace="~{fragments/sidebar :: scripts}"></script>
</body></html>
