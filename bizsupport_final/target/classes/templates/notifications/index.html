<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Уведомления — BizSupport</title>
<th:block th:replace="~{fragments/sidebar :: head}"/></head>
<body>
<th:block th:replace="~{fragments/sidebar :: sidebar(activePage='notifications')}"/>
<div class="main">
  <div class="page-header d-flex justify-content-between align-items-start">
    <div><h1><i class="bi bi-bell" style="color:var(--warning)"></i> Уведомления</h1><p>Напоминания о дедлайнах и событиях</p></div>
    <form th:if="${!notifications.isEmpty()}" th:action="@{/notifications/read-all}" method="post">
      <button type="submit" class="btn-outline-custom"><i class="bi bi-check2-all"></i> Прочитать все</button>
    </form>
  </div>
  <div th:if="${notifications.isEmpty()}" class="empty-state"><i class="bi bi-bell-slash"></i><p>Уведомлений пока нет</p><p class="small">Они появятся при приближении дедлайнов</p></div>
  <div th:each="n : ${notifications}" class="data-item" th:style="${!n.isRead} ? 'border-left:3px solid var(--warning);background:var(--warning-light)' : ''">
    <div class="icon-circle" th:classappend="${n.title.contains('Срочно')} ? 'danger' : (${n.title.contains('Через 3')} ? 'amber' : 'blue')">
      <i th:classappend="${n.title.contains('Срочно')} ? 'bi-exclamation-triangle-fill' : (${n.title.contains('Через 3')} ? 'bi-clock-fill' : 'bi-bell-fill')" class="bi"></i>
    </div>
    <div class="flex-grow-1">
      <div style="font-weight:600" th:classappend="${!n.isRead} ? 'fw-bold'" th:text="${n.title}"></div>
      <div style="font-size:.85rem;color:var(--muted)" th:text="${n.message}"></div>
    </div>
    <div class="d-flex flex-column align-items-end gap-1">
      <span style="font-size:.75rem;color:var(--muted)" th:text="${#temporals.format(n.createdAt, 'dd.MM.yyyy HH:mm')}"></span>
      <div class="d-flex gap-1">
        <form th:if="${!n.isRead}" th:action="@{/notifications/{id}/read(id=${n.id})}" method="post"><button type="submit" class="btn-outline-custom" style="padding:2px 8px;font-size:.75rem" title="Прочитано"><i class="bi bi-check2"></i></button></form>
        <form th:action="@{/notifications/{id}/delete(id=${n.id})}" method="post"><button type="submit" class="btn-outline-custom" style="padding:2px 8px;font-size:.75rem;color:var(--danger)" title="Удалить"><i class="bi bi-trash"></i></button></form>
      </div>
    </div>
  </div>
</div>
<script th:replace="~{fragments/sidebar :: scripts}"></script>
</body></html>
