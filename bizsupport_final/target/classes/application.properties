spring.application.name=bizsupport

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/bizsupport_db
spring.datasource.username=bizsupport_user
spring.datasource.password=bizsupport_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# JWT
app.jwt.secret=bizsupport-secret-key-2025-very-long-string-for-security
app.jwt.expiration=86400000

# Server
server.port=8080
server.servlet.context-path=/

# Logging
logging.level.ru.bizsupport=DEBUG
logging.level.org.springframework.security=INFO

# OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.packages-to-scan=ru.bizsupport.controller.api

app.tenders.auto-load=true

# ── Провайдер тендеров ──────────────────────────────────────────────────────
# mock  — генерация демо-данных (по умолчанию, не требует сети)
# eis   — реальные данные из zakupki.gov.ru
app.tenders.provider=mock

# Периодическое обновление (требует provider=eis и supportsRefresh=true)
app.tenders.refresh-enabled=false
app.tenders.refresh-cron=0 0 */6 * * *

# ── Интеграция с ЕИС (zakupki.gov.ru) ──────────────────────────────────────
# Активировать: поменять app.tenders.provider=eis и app.tenders.refresh-enabled=true
#
# Токен API (опционально, для повышенного rate-limit):
#   zakupki.gov.ru → Личный кабинет → Настройки → API-токен
app.eis.base-url=https://zakupki.gov.ru
app.eis.api-token=

# Какие законы подгружать
app.eis.fz44=true
app.eis.fz223=true

# Кол-во тендеров на страницу (10 / 25 / 50)
app.eis.page-size=50
# Сколько страниц загружать при первом запуске (50 × 2 = 100 тендеров)
app.eis.initial-pages=2

# Фильтр по региону (пусто = все регионы; пример: 77 = Москва, 78 = СПб)
app.eis.region=

# Только МСП-закупки
app.eis.msp-only=false

# Таймауты HTTP
app.eis.connect-timeout-ms=15000
app.eis.read-timeout-ms=45000


# ── Базовый URL OpenAI-совместимого API ──
# OpenAI:        https://api.openai.com/v1
# OpenRouter:    https://openrouter.ai/api/v1
# DeepSeek:      https://api.deepseek.com/v1
# Ollama:        http://localhost:11434/v1
# LM Studio:     http://localhost:1234/v1
# llama.cpp:     http://localhost:8081/v1
app.assistant.base-url=https://api.deepseek.com/v1

# ── API ключ ──
# Если не указан, ассистент покажет сообщение о настройке
# Для self-hosted (Ollama, LM Studio) можно поставить любую заглушку, например "sk-local"
app.assistant.api-key=sk-38ffab9df07e44f69f0fe9487e153337

# ── Модель ──
# OpenAI: gpt-4o-mini, gpt-4o, gpt-3.5-turbo
# OpenRouter: meta-llama/llama-3.1-8b-instruct:free, anthropic/claude-3-haiku
# DeepSeek: deepseek-chat
# Ollama: llama3.1, qwen2.5, mistral
app.assistant.model=deepseek-chat

# ── Параметры генерации ──
app.assistant.max-tokens=1000
app.assistant.temperature=0.7
app.assistant.timeout-ms=30000