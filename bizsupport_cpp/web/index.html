<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BizSupport — Вход</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="brand">Biz<span>Support</span></div>
      <div class="subtitle">Поддержка малого и среднего бизнеса</div>

      <div class="auth-tabs">
        <button id="tabLogin" class="active">Вход</button>
        <button id="tabRegister">Регистрация</button>
      </div>

      <div id="alert"></div>

      <!-- Login form -->
      <form id="loginForm">
        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" placeholder="admin@bizsupport.ru" required>
        </div>
        <div class="form-group">
          <label>Пароль</label>
          <input type="password" name="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn">Войти</button>
      </form>

      <!-- Register form -->
      <form id="registerForm" style="display:none">
        <div class="form-group">
          <label>Полное имя</label>
          <input type="text" name="fullName" placeholder="Иван Иванов" required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" placeholder="you@company.ru" required>
        </div>
        <div class="form-group">
          <label>Пароль</label>
          <input type="password" name="password" placeholder="минимум 6 символов" minlength="6" required>
        </div>
        <button type="submit" class="btn">Создать аккаунт</button>
      </form>

      <div class="hint">Демо-доступ: <b>admin@bizsupport.ru</b> / <b>admin123</b></div>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script>
    if (Auth.isLoggedIn()) location.href = '/dashboard.html';

    const tabLogin = document.getElementById('tabLogin');
    const tabRegister = document.getElementById('tabRegister');
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const alertBox = document.getElementById('alert');

    function showAlert(msg, type = 'error') {
      alertBox.innerHTML = `<div class="alert ${type}">${escapeHtml(msg)}</div>`;
    }

    tabLogin.onclick = () => {
      tabLogin.classList.add('active'); tabRegister.classList.remove('active');
      loginForm.style.display = ''; registerForm.style.display = 'none'; alertBox.innerHTML = '';
    };
    tabRegister.onclick = () => {
      tabRegister.classList.add('active'); tabLogin.classList.remove('active');
      registerForm.style.display = ''; loginForm.style.display = 'none'; alertBox.innerHTML = '';
    };

    loginForm.onsubmit = async (e) => {
      e.preventDefault();
      const f = new FormData(loginForm);
      try {
        const data = await api('/auth/login', {
          method: 'POST',
          body: { email: f.get('email'), password: f.get('password') }
        });
        Auth.set(data.token, { email: data.email, fullName: data.fullName, role: data.role });
        location.href = '/dashboard.html';
      } catch (err) { showAlert(err.message || 'Не удалось войти'); }
    };

    registerForm.onsubmit = async (e) => {
      e.preventDefault();
      const f = new FormData(registerForm);
      try {
        const data = await api('/auth/register', {
          method: 'POST',
          body: { email: f.get('email'), password: f.get('password'), fullName: f.get('fullName') }
        });
        Auth.set(data.token, { email: data.email, fullName: data.fullName, role: data.role });
        location.href = '/dashboard.html';
      } catch (err) { showAlert(err.message || 'Ошибка регистрации'); }
    };
  </script>
</body>
</html>
