version: "3.8"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bizsupport_db
      POSTGRES_USER: bizsupport_user
      POSTGRES_PASSWORD: bizsupport_pass
    ports:
      - "5433:5432"
    volumes:
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bizsupport_user -d bizsupport_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: bizsupport_db
      DB_USER: bizsupport_user
      DB_PASSWORD: bizsupport_pass
      APP_JWT_SECRET: ${APP_JWT_SECRET:-bizsupport-docker-secret-key-2025-very-long-string}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
